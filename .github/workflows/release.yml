name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry-run path: run this workflow manually from the Actions tab to exercise
  # build -> tests -> signing gate -> publish -> sign/verify -> SBOM -> checksums
  # -> release manifest without creating or pushing a tag. A manual run never
  # creates a GitHub release (that step runs on push events only), so it is safe
  # to rehearse the whole release pipeline before any real tag exists.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_SIGNING_REQUIRED: ${{ vars.RELEASE_SIGNING_REQUIRED }}
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve run mode
        id: mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A manual run is always a dry run: no tag, no GitHub release.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            'is_dry_run=true' >> $env:GITHUB_OUTPUT
            'asset_tag=dry-run' >> $env:GITHUB_OUTPUT
            Write-Host 'Dry run: tag gates use the csproj version and the GitHub release step is skipped.'
          }
          else {
            'is_dry_run=false' >> $env:GITHUB_OUTPUT
            "asset_tag=$env:REF_NAME" >> $env:GITHUB_OUTPUT
          }

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore zEClass.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build zEClass.sln --configuration Release --no-restore

      - name: Tests (including soak)
        run: >
          dotnet test tests/zEClass.Tests/zEClass.Tests.csproj
          --configuration Release --no-build
          --logger "console;verbosity=normal"

      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          $out = dotnet list zEClass.sln package --vulnerable --include-transitive | Out-String
          $out | Write-Host
          if ($out -match 'has the following vulnerable packages') {
            if ($out -match '\[(Critical|High)\]') {
              Write-Error 'High or Critical vulnerable packages found; the release is blocked.'
              exit 1
            }
            Write-Warning 'Vulnerable packages below the High threshold; recorded but not failing.'
          }

      - name: Signing gate
        shell: pwsh
        run: |
          if ($env:RELEASE_SIGNING_REQUIRED -ne 'true') {
            Write-Host 'RELEASE_SIGNING_REQUIRED is not "true": publishing an unsigned pilot build.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGN_PFX_PASSWORD)) {
            Write-Error 'Production signing is required but SIGN_PFX_BASE64 or SIGN_PFX_PASSWORD is not configured. Release blocked.'
            exit 1
          }
          Write-Host 'Production signing is required; the certificate and password are configured.'

      - name: Publish (all supported RIDs)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64', 'win-x86') {
            $out = Join-Path 'publish' $rid
            dotnet publish src/zEClass/zEClass.csproj --configuration Release -r $rid --self-contained true --output $out
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }
            $exe = Join-Path $out 'zEClass.exe'
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "$exe is not a valid PE file"
            }
          }

      - name: Authenticode sign (SignTool)
        if: env.RELEASE_SIGNING_REQUIRED == 'true'
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          try {
            foreach ($rid in 'win-x64', 'win-arm64', 'win-x86') {
              $exe = Join-Path 'publish' $rid 'zEClass.exe'
              $signCmd = @(
                'signtool', 'sign',
                '/f', $pfxPath,
                '/p', $env:SIGN_PFX_PASSWORD,
                '/tr', 'http://timestamp.digicert.com',
                '/td', 'sha256',
                '/fd', 'sha256',
                $exe
              )
              & $signCmd
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $rid" }
              $sig = Get-AuthenticodeSignature $exe
              if ($sig.Status -ne 'Valid') {
                # Dry runs use the self-signed CI-validation certificate, which can
                # never chain to a trusted root: tolerate NotTrusted for that exact
                # subject on workflow_dispatch only. Tag releases stay fail-closed.
                $dryRunTolerance = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and
                  $sig.Status -eq 'NotTrusted' -and
                  $null -ne $sig.SignerCertificate -and
                  $sig.SignerCertificate.Subject -eq 'CN=zEClass self-signed CI validation'
                if (-not $dryRunTolerance) {
                  Write-Error "Signing verification failed for ${rid}: $($sig.Status)"
                  exit 1
                }
                Write-Warning "Dry run: tolerating $($sig.Status) for CI-validation subject on $rid."
              }
              else {
                Write-Host "$rid signed and verified: $($sig.Status)"
              }
            }
          }
          finally {
            if (Test-Path $pfxPath) {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Verify signatures (all builds)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64', 'win-x86') {
            $exe = Join-Path 'publish' $rid 'zEClass.exe'
            $sig = Get-AuthenticodeSignature $exe
            Write-Host "$rid signature: $($sig.Status) $(if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject })"
          }

      - name: SBOM
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet cyclonedx src/zEClass/zEClass.csproj --output sbom --output-format Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sbomPath = Join-Path 'sbom' 'bom.json'
          if (-not (Test-Path $sbomPath)) {
            Write-Error 'SBOM was not generated.'
            exit 1
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $sbomPath (Join-Path 'artifacts' 'zEClass-bom.json')
          Write-Host "SBOM: $sbomPath"

      - name: Version consistency (tag vs assembly)
        shell: pwsh
        env:
          ASSET_TAG: ${{ steps.mode.outputs.asset_tag }}
          IS_DRY_RUN: ${{ steps.mode.outputs.is_dry_run }}
        run: |
          $csproj = [xml](Get-Content src/zEClass/zEClass.csproj)
          $declared = $csproj.Project.PropertyGroup.Version
          if ($env:IS_DRY_RUN -eq 'true') {
            # No tag exists on a manual run: the real tag gate stays with the
            # tag-triggered run; here we prove the declared version is SemVer.
            if ($declared -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              Write-Error "csproj Version '$declared' is not SemVer."
              exit 1
            }
            Write-Host "Dry run: csproj version $declared is valid SemVer (tag check deferred)."
            exit 0
          }
          $tag = $env:ASSET_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Tag '$tag' is not SemVer (expected v1.2.3)."
            exit 1
          }
          $version = $tag.TrimStart('v').Split('-')[0]
          if ($declared -ne $version) {
            Write-Error "Tag version $version does not match csproj Version $declared."
            exit 1
          }
          Write-Host "Version consistent: $tag == $declared"

      - name: Package release assets
        shell: pwsh
        env:
          ASSET_TAG: ${{ steps.mode.outputs.asset_tag }}
        run: |
          foreach ($rid in 'win-x64', 'win-arm64', 'win-x86') {
            $zip = Join-Path 'artifacts' "zEClass-$env:ASSET_TAG-$rid.zip"
            Compress-Archive -Path (Join-Path (Join-Path 'publish' $rid) '*') -DestinationPath $zip -CompressionLevel Optimal
            if (-not (Test-Path $zip)) { throw "missing $zip" }
          }
          Get-ChildItem artifacts | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($file in (Get-ChildItem artifacts -File)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content (Join-Path 'artifacts' 'SHA256SUMS.txt') -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }

      - name: Release manifest
        shell: pwsh
        env:
          ASSET_TAG: ${{ steps.mode.outputs.asset_tag }}
        run: |
          $sbomHash = (Get-FileHash (Join-Path 'artifacts' 'zEClass-bom.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = foreach ($file in (Get-ChildItem artifacts -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' -and $_.Name -ne 'release-manifest.json' })) {
            $sig = $null
            if ($file.Extension -eq '.zip') {
              $tmp = Join-Path $env:RUNNER_TEMP ("sigcheck-" + $file.BaseName)
              Expand-Archive -Path $file.FullName -DestinationPath $tmp -Force
              $exe = Join-Path $tmp '*\zEClass.exe'
              $hit = Get-Item $exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $sig = Get-AuthenticodeSignature $hit.FullName }
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            } else {
              $sig = Get-AuthenticodeSignature $file.FullName
            }
            [ordered]@{
              product = 'zEClass'
              version = $env:ASSET_TAG
              commit = $env:GITHUB_SHA
              artifact = $file.Name
              sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              size = $file.Length
              signed = ($sig -and $sig.Status -eq 'Valid')
              signer = if ($sig -and $sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }
              sbomSha256 = $sbomHash
              buildWorkflow = "$env:GITHUB_WORKFLOW"
              buildRunId = "$env:GITHUB_RUN_ID"
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path 'artifacts' 'release-manifest.json') -Encoding utf8
          Get-Content (Join-Path 'artifacts' 'release-manifest.json')
          $lines = foreach ($file in (Get-ChildItem artifacts -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' })) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content (Join-Path 'artifacts' 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.mode.outputs.asset_tag }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        # Push-event only: a workflow_dispatch dry run must never publish.
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title "zEClass $env:GITHUB_REF_NAME" @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }